name: Piyasa verisi
on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '*/30 7-15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch_market.mjs
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Piyasa verisi güncellendi" && git push)
