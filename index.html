<div class="card"><span class="mut">Aktif proje</span><div class="text-2xl font-bold">${S.projects.filter(p=>p.st!='done').length}</div></div>
<div class="card"><span class="mut">Bu ay net</span><div class="text-2xl font-bold" style="color:var(--${sumTx('gelir',m)>=sumTx('gider',m)?'ok':'bad'})">${TL(sumTx('gelir',m)-sumTx('gider',m))}</div></div></div>
<div class="grid gap-3 md:grid-cols-2 mt-3"><div class="card"><h2>💧 Su</h2><div class="flex items-center gap-3"><button class="btn" data-a="w" data-v="-1">−</button><b class="text-3xl flex-1 text-center">${d.water} <span class="mut text-base">bardak</span></b><button class="btn" data-a="w" data-v="1">+ Bardak</button></div></div>
<div class="card"><h2>🔋 Gün sonu durumu</h2>${SL.map(([k,n,a,b,st])=>`<label class="block mb-2">${n}: <b id="o-${k}">${d[k]??(k=='sleep'?7:5)}</b><input type="range" min="${a}" max="${b}" step="${st}" value="${d[k]??(k=='sleep'?7:5)}" data-a="sl" data-k="${k}"></label>`).join('')}</div>
<div class="card md:col-span-2"><h2>💊 Takviyeler</h2><div class="flex flex-wrap gap-2">${VIT.map(v=>`<button class="chip ${d.vit[v]?'on':''}" data-a="vit" data-v="${v}">${d.vit[v]?'✓ ':''}${v}</button>`).join('')}</div></div>${dayCard()}</div>`},
proje(){return`<div class="card mt-2"><h2>Yeni proje / görev</h2><div class="flex flex-wrap gap-2"><input id="pt" placeholder="Başlık" class="flex-1 min-w-[160px]">${sel('pc',CATS)}${sel('ps',ST.map(s=>s[0]))}<button class="btn" data-a="padd">Ekle (+10 XP)</button></div></div>
<div class="grid gap-3 md:grid-cols-3 mt-3">${ST.map(([k,n])=>`<div><h2>${n} <span class="mut">(${S.projects.filter(p=>p.st==k).length})</span></h2>${S.projects.filter(p=>p.st==k).map(p=>`<div class="card mb-2"><div class="flex justify-between gap-2"><b>${esc(p.t)}</b><button class="x" data-a="pdel" data-i="${p.id}" aria-label="Sil">×</button></div><div class="mut text-xs">${esc(p.cat)}</div><div class="bar"><i style="width:${p.p}%"></i></div><div class="flex items-center gap-2"><button class="chip" data-a="pinc" data-i="${p.id}" data-v="-10">−10</button><span class="text-xs">%${p.p}</span><button class="chip" data-a="pinc" data-i="${p.id}" data-v="10">+10</button><select class="ml-auto text-xs" data-c="pst" data-i="${p.id}">${ST.map(s=>`<option value="${s[0]}" ${s[0]==p.st?'selected':''}>${s[1]}</option>`).join('')}</select></div></div>`).join('')||'<p class="mut">Boş</p>'}</div>`).join('')}</div>`},
eko(){const m=td().slice(0,7);return finPanel()+`<div class="hidden"><span class="mut">Toplam net varlık</span><div class="text-4xl font-bold">${TL(worth())}</div><div class="mut">Bu ay gelir ${TL(sumTx('gelir',m))} · gider ${TL(sumTx('gider',m))}</div></div><div class="card mt-3">${mkt()}</div>
<div class="grid gap-3 lg:grid-cols-2 mt-3"><div class="card overflow-x-auto"><h2>Portföyüm</h2><table class="w-full"><tr><th>Varlık</th><th>Miktar</th><th>Alış ₺</th><th>Güncel ₺</th><th>Değer</th><th>Kâr/Zarar</th><th></th></tr>${S.assets.map(a=>`<tr><td>${esc(a.n)}<br><span class="mut text-xs">${a.type}</span></td><td>${a.qty}</td><td><input type="number" step="any" value="${cs(a)}" data-c="ac" data-i="${a.id}" style="width:80px"></td><td><input type="number" step="any" value="${a.price}" data-c="ap" data-i="${a.id}" style="width:80px"></td><td>${TL(a.qty*a.price)}</td><td ${pc(a.qty*(a.price-cs(a)))}>${a.type=='Nakit'?'—':sg(a.qty*(a.price-cs(a)))}</td><td><button class="x" data-a="adel" data-i="${a.id}" aria-label="Sil">×</button></td></tr>`).join('')}</table>
<div class="flex flex-wrap gap-2 mt-3"><input id="an" placeholder="Varlık adı" class="flex-1 min-w-[120px]">${sel('at',AT)}<input id="aq" type="number" step="any" placeholder="Miktar" style="width:90px"><input id="aco" type="number" step="any" placeholder="Alış ₺" style="width:90px"><input id="apr" type="number" step="any" placeholder="Güncel ₺" style="width:90px"><button class="btn" data-a="aadd">Ekle (+5 XP)</button></div></div>
<div class="card"><h2>Gelir / gider</h2><div class="flex flex-wrap gap-2"><input id="tt" placeholder="Açıklama" class="flex-1 min-w-[120px]"><input id="ta" type="number" placeholder="Tutar" style="width:90px">${sel('tk',['gider','gelir'])}${sel('tc',XC)}<button class="btn" data-a="tadd">Ekle (+3 XP)</button></div><label class="chip mt-2 inline-block" style="cursor:pointer">📄 Banka ekstresi yükle (CSV)<input type="file" accept=".csv,.txt" data-c="csv" hidden></label><span class="mut text-sm ml-2">${MSG}</span>
${[...S.tx].sort((a,b)=>b.d<a.d?-1:1).slice(0,12).map(x=>`<div class="flex items-center gap-2 py-2 border-b" style="border-color:var(--ln)"><span class="flex-1">${esc(x.t)}<br><span class="mut text-xs">${x.d} · ${x.cat}</span></span><b style="color:var(--${x.type=='gelir'?'ok':'bad'})">${x.type=='gelir'?'+':'−'}${TL(x.amt)}</b><button class="x" data-a="tdel" data-i="${x.id}" aria-label="Sil">×</button></div>`).join('')}</div></div>`},
not(){const tags=[...new Set(S.notes.flatMap(n=>n.tags))];return`<div class="card mt-2"><h2>Beyin fırtınası</h2><textarea id="nt" rows="3" class="w-full" placeholder="Aklına geleni yaz. #etiket ekleyerek kategorile"></textarea><div class="mt-2"><button class="btn" data-a="nadd">Kaydet (+4 XP)</button></div></div>
<div class="flex flex-wrap gap-2 my-3"><button class="chip ${NF?'':'on'}" data-a="nf" data-v="">Hepsi</button>${tags.map(t=>`<button class="chip ${NF==t?'on':''}" data-a="nf" data-v="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
<div class="grid gap-2 md:grid-cols-2">${S.notes.filter(n=>!NF||n.tags.includes(NF)).reverse().map(n=>`<div class="card"><div class="flex justify-between gap-2"><span>${esc(n.t).replace(/#([\p{L}\d_]+)/gu,'<b style="color:var(--ac)">#$1</b>')}</span><button class="x" data-a="ndel" data-i="${n.id}" aria-label="Sil">×</button></div><div class="mut text-xs mt-1">${n.d}</div></div>`).join('')}</div>`},
analiz(){return`<div class="grid gap-3 md:grid-cols-2 mt-2"><div class="card"><h2>Son 7 gün: enerji ve odak</h2><canvas id="c1" height="220"></canvas></div><div class="card"><h2>Varlık dağılımı</h2><canvas id="c2" height="220"></canvas></div><div class="card"><h2>Giderler (bu ay)</h2><canvas id="c3" height="220"></canvas></div><div class="card"><h2>Haftalık harcama</h2><canvas id="c4" height="220"></canvas></div></div>`},
spor(){const ex={};S.gym.forEach(g=>(ex[g.e]=ex[g.e]||[]).push(g));return`<div class="card mt-2"><h2>Antrenman kaydı</h2><div class="flex flex-wrap gap-2"><input id="ge" list="gl" placeholder="Hareket (Vücut kilosu da olur)" class="flex-1 min-w-[160px]"><datalist id="gl">${Object.keys(ex).map(e=>`<option>${esc(e)}`).join('')}</datalist><input id="gk" type="number" step="0.5" placeholder="kg" style="width:80px"><input id="gr" type="number" placeholder="Tekrar" style="width:80px"><input id="gs" type="number" placeholder="Set" style="width:70px"><button class="btn" data-a="gadd">Kaydet (+6 XP)</button></div></div><div class="grid gap-3 md:grid-cols-2 mt-3">${Object.entries(ex).map(([e,a])=>{const days={};a.forEach(g=>days[g.d]=Math.max(days[g.d]||0,g.kg));const v=Object.keys(days).sort().map(k=>days[k]),l=a[a.length-1];return`<div class="card"><b>${esc(e)}</b><div class="flex justify-between text-sm mt-1"><span>Son: <b>${l.kg} kg</b> × ${l.r||'?'} × ${l.s||'?'}</span><span>En iyi: <b>${Math.max(...v)} kg</b></span></div>${sp(v)}<span class="mut text-xs">${v.length} gün</span><div class="mt-1">${a.slice(-3).map(g=>`<button class="chip mr-1" data-a="gdel" data-i="${g.id}" title="Sil">${g.d.slice(5)} · ${g.kg} ×</button>`).join('')}</div></div>`}).join('')||'<p class="mut">İlk hareketini kaydet.</p>'}</div>`},
ilham(){const pool=[...S.ins.map(x=>({k:'i'+x.id,type:x.type,t:x.t,d:x.d,src:x.src||'Koleksiyonum'})),...S.notes.map(n=>({k:'n'+n.id,type:'fikir',t:n.t.replace(/#[\p{L}\d_]+/gu,'').trim(),d:n.d,src:'Beyin fırtınası'})),...S.projects.filter(p=>p.st!='done').map(p=>({k:'p'+p.id,type:'hedef',t:p.t+' (%'+p.p+')',d:td(),src:p.cat}))];if(!pool.length)return'<div class="card mt-2 mut">Henüz içerik yok. Aşağıdan bir alıntı, anı, hedef ya da fikir ekle.</div>';const h=[...td()].reduce((s,c)=>s*31+c.charCodeAt(0)|0,7),it=pool[Math.abs(h+SH)%pool.length],fv=S.fav.includes(it.k);
 return`<div class="card mt-2 text-center" style="padding:32px 20px;background:linear-gradient(135deg,var(--card),#1b2a55)"><span class="mut">${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</span><div class="mut mt-1 text-sm">${it.type}</div><p class="text-2xl font-bold my-4" style="font-family:Georgia,serif">${esc(it.t)}</p><div class="mut text-sm">${esc(it.src)} · ${it.d}</div><div class="flex gap-2 justify-center mt-4"><button class="btn" data-a="shuf">Başka göster</button><button class="chip ${fv?'on':''}" data-a="fav" data-v="${it.k}">${fv?'★ Favori':'☆ Favori yap'}</button></div></div><div class="card mt-3"><h2>Koleksiyona ekle</h2><div class="flex flex-wrap gap-2"><select id="it"><option>alıntı</option><option>anı</option><option>hedef</option><option>fikir</option></select><input id="ix" placeholder="Metin" class="flex-1 min-w-[160px]"><input id="is" placeholder="Kaynak (isteğe bağlı)" style="width:150px"><button class="btn" data-a="iadd">Ekle (+4 XP)</button></div></div>${S.fav.length?`<div class="card mt-3"><h2>Favorilerim</h2>${pool.filter(p=>S.fav.includes(p.k)).map(p=>`<div class="note">${esc(p.t)}<div class="mut text-xs">${p.type} · ${esc(p.src)}</div></div>`).join('')}</div>`:''}`},
veri(){return`<div class="card mt-2"><h2>Veri yönetimi</h2><p class="mut">Tüm verin bu tarayıcıda (localStorage) tek bir JSON olarak tutulur. Başka bir yere gönderilmez.</p>
<div class="flex flex-wrap gap-2"><button class="btn" data-a="exp">JSON olarak indir</button><label class="btn" style="cursor:pointer">JSON yükle<input type="file" accept=".json,application/json" data-c="imp" hidden></label><button class="btn" data-a="cp">Yapay zeka için kopyala</button><button class="chip" data-a="rst">Örnek veriye sıfırla</button></div>
<p id="msg" class="mt-3" style="color:var(--ok)">${MSG}</p><textarea id="ta2" rows="8" class="w-full mt-2" placeholder="Gerekirse JSON'u buraya yapıştırıp yükleyebilirsin"></textarea><button class="chip mt-2" data-a="imp2">Yapıştırdığımı yükle</button></div>`}};
function charts(){CH.forEach(c=>c.destroy());CH=[];if(tab!='analiz'||!window.Chart)return;const L=[6,5,4,3,2,1,0].map(D),g=k=>L.map(d=>S.days[d]?S.days[d][k]:null),tc=getComputedStyle(document.documentElement).getPropertyValue('--mut');Chart.defaults.color=tc;
 CH.push(new Chart($('#c1'),{type:'line',data:{labels:L.map(d=>d.slice(5)),datasets:[{label:'Enerji',data:g('energy'),borderColor:'#6d7cff',backgroundColor:'#6d7cff',tension:.3,spanGaps:true},{label:'Odak',data:g('focus'),borderColor:'#34d399',backgroundColor:'#34d399',tension:.3,spanGaps:true}]},options:{scales:{y:{min:0,max:10}}}}));
 const t={};S.assets.forEach(a=>t[a.type]=(t[a.type]||0)+a.qty*a.price);CH.push(new Chart($('#c2'),{type:'doughnut',data:{labels:Object.keys(t),datasets:[{data:Object.values(t),backgroundColor:['#94a3b8','#fbbf24','#34d399','#6d7cff','#f472b6'],borderWidth:0}]}}));const m=td().slice(0,7),e={};S.tx.filter(x=>x.type=='gider'&&x.d.startsWith(m)).forEach(x=>e[x.cat]=(e[x.cat]||0)+x.amt);CH.push(new Chart($('#c3'),{type:'doughnut',data:{labels:Object.keys(e),datasets:[{data:Object.values(e),backgroundColor:['#f2994a','#2d9cdb','#27ae60','#bb6bd9','#eb5757','#f2c94c','#9aa5b1'],borderWidth:0}]}}));const w=[0,0,0,0,0,0,0,0];S.tx.filter(x=>x.type=='gider').forEach(x=>{const i=Math.floor((new Date(td())-new Date(x.d))/6048e5);if(i>=0&&i<8)w[i]+=x.amt});CH.push(new Chart($('#c4'),{type:'bar',data:{labels:w.map((_,i)=>i?i+' hf önce':'Bu hafta').reverse(),datasets:[{label:'Gider ₺',data:w.slice().reverse(),backgroundColor:'#6d7cff'}]}}))}
function render(){S.nw[td()]=Math.round(worth());const lvl=Math.floor(S.xp/100)+1,nb=K.map(([k,n,i])=>`<button class="${k==tab?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${n}</button>`).join('');
 $('#lv').innerHTML=`<div class="flex justify-between text-sm"><b>Seviye ${lvl} · ${TITLES[Math.min(lvl-1,6)]}</b><span class="mut">${S.xp%100}/100 XP</span></div><div class="bar" style="margin:4px 0 0"><i style="width:${S.xp%100}%"></i></div>`;
 $('#tn').innerHTML=K.map(([k,n,i])=>`<button class="${k==tab?'on':''}" data-a="tab" data-v="${k}">${i} ${n}</button>`).join('');$('#bn').innerHTML=nb;
 $('#v').innerHTML=VW[tab]();charts()}
const v=i=>$('#'+i).value.trim(),proj=i=>S.projects.find(p=>p.id==i);
function setSt(p,s){if(s=='done'&&p.st!='done'){p.p=100;xp(25)}p.st=s}
const A={tab:e=>{tab=e.v;MSG=''},gadd:()=>{const e=v('ge'),k=+v('gk');if(e&&k>0){S.gym.push({id:uid(),d:td(),e,kg:k,r:+v('gr')||0,s:+v('gs')||0});xp(6)}},gdel:e=>{S.gym=S.gym.filter(x=>x.id!=e.i)},iadd:()=>{const t=v('ix');if(t){S.ins.push({id:uid(),type:v('it'),t,d:td(),src:v('is')||'Koleksiyonum'});xp(4)}},shuf:()=>{SH=1+Math.floor(Math.random()*997)},fav:e=>{S.fav=S.fav.includes(e.v)?S.fav.filter(x=>x!=e.v):[...S.fav,e.v]},
 aic:()=>{const w=Object.entries(S.days).sort().slice(-7),d=day(),vt=VIT.filter(x=>d.vit[x]).length;ask('c',`Türkçe, sıcak ama dürüst bir koç gibi yaz, en fazla 7 cümle. Kişi: makine mühendisliği öğrencisi. Bugünkü durum: ${JSON.stringify(d)}. Su hedefi 8 bardak, takviye ${vt}/${VIT.length}. Son 7 gün: ${JSON.stringify(w)}. Son 7 gün antrenmanlar: ${JSON.stringify(S.gym.filter(x=>x.d>=D(6)))}. Açık projeler: ${JSON.stringify(S.projects.filter(p=>p.st!='done').map(p=>({t:p.t,yüzde:p.p})))}. Optimal aralıklar: uyku 7-9 saat, enerji/odak/ruh hali 7-10, yorgunluk 1-4. Önce genel bir değerlendirme yap, neyin iyi gittiğini ve neyin dikkat istediğini söyle, bugün için 2 somut öneri ver. Para konusuna girme. Tıbbi tavsiye değildir.`)},
 aid:()=>{const w=Object.entries(S.days).sort().slice(-7);ask('d',`Türkçe yaz, en fazla 5 cümle. Kişinin bugünkü değerleri (uyku saat; enerji, odak, ruh hali, yorgunluk 1-10): ${JSON.stringify(day())}. Son günler: ${JSON.stringify(w)}. Optimal aralıklar: uyku 7-9, enerji/odak/ruh hali 7-10, yorgunluk 1-4. Yorgunluğu ve dengeyi değerlendir, tek somut öneri ver. Tıbbi tavsiye değildir.`)},
 aim:()=>{const m=td().slice(0,7),f=y=>sumTx(y,m);ask('m',`Türkçe yaz, en fazla 6 cümle. Aşağıdaki piyasa verisi ${MK.tarih} tarihlidir (seriler eski→yeni): ${JSON.stringify(MK.rows)}. Başka veri uydurma. Dolar, euro, altın ve BIST 100 trendlerini yorumla; sonra kişinin bu ayki geliri ${f('gelir')} ₺, gideri ${f('gider')} ₺ için kısa bir not ekle. Yatırım tavsiyesi değildir.`)},w:e=>sd(d=>{d.water=Math.max(0,d.water+ +e.v);if(e.v>0)xp(2)}),vit:e=>sd(d=>{d.vit[e.v]=!d.vit[e.v];if(d.vit[e.v])xp(3)}),
 padd:()=>{const t=v('pt');if(t){S.projects.push({id:uid(),t,cat:v('pc'),st:v('ps'),p:v('ps')=='done'?100:0});xp(10)}},
 pdel:e=>{S.projects=S.projects.filter(p=>p.id!=e.i)},pinc:e=>{const p=proj(e.i);p.p=Math.max(0,Math.min(100,p.p+ +e.v));if(p.p==100)setSt(p,'done');else if(p.p>0&&p.st=='todo')p.st='doing'},
 aadd:()=>{const n=v('an'),q=+v('aq'),p=+v('apr');if(n&&q>0&&p>=0){S.assets.push({id:uid(),n,type:v('at'),qty:q,price:p,cost:+v('aco')||p});xp(5)}},adel:e=>{S.assets=S.assets.filter(a=>a.id!=e.i)},
 tadd:()=>{const t=v('tt'),a=+v('ta');if(t&&a>0){S.tx.push({id:uid(),d:td(),t,type:v('tk'),cat:v('tc'),amt:a});xp(3)}},tdel:e=>{S.tx=S.tx.filter(x=>x.id!=e.i)},
 nadd:()=>{const t=v('nt');if(t){S.notes.push({id:uid(),t,tags:[...new Set((t.match(/#[\p{L}\d_]+/gu)||[]).map(x=>x.slice(1).toLowerCase()))],d:td()});xp(4)}},ndel:e=>{S.notes=S.notes.filter(n=>n.id!=e.i)},nf:e=>{NF=e.v},
 rst:()=>{if(confirm('Tüm veriler örnek veriyle değiştirilecek. Emin misin?')){S=seed();MSG='Örnek veriye dönüldü.'}},
 exp:async()=>{const j=JSON.stringify(S,null,2);try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:'lifeos-yedek-'+td()+'.json',data:j});say('Yedek kaydedildi.');return}}catch(e){}$('#ta2').value=j;say('İndirme bu görünümde kullanılamıyor. JSON kutuya konuldu, kopyalayıp dosyaya kaydedebilirsin.')},
 cp:async()=>{const j='Aşağıda Life OS verilerim JSON olarak var. Verilere bakıp bana kişisel tavsiyeler ver.\n'+JSON.stringify(S,null,1);try{await navigator.clipboard.writeText(j);say('Panoya kopyalandı. Şimdi Claude\'a yapıştırabilirsin.')}catch(e){$('#ta2').value=j;$('#ta2').select();say('Otomatik kopyalama olmadı. Kutudaki metni seçip kopyala.')}},
 imp2:()=>load($('#ta2').value)};
const say=t=>{MSG=t;const m=$('#msg');if(m)m.textContent=t};
function load(t){try{const o=JSON.parse(t);if(!o.v||!Array.isArray(o.projects)||!Array.isArray(o.assets))throw 0;S=Object.assign(seed(),o);save();say('Veri yüklendi.');render()}catch(e){say('Geçerli bir Life OS JSON dosyası değil.')}}
const SYNC=['exp','cp','imp2'];
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=A[b.dataset.a](b.dataset);if(SYNC.includes(b.dataset.a))return;save();render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a=='sl'){sd(d=>{d[t.dataset.k]=+t.value;(d.set=d.set||{})[t.dataset.k]=1});$('#o-'+t.dataset.k).textContent=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(t.dataset.a=='sl'){save();render();return}if(!c)return;if(c=='pst')setSt(proj(t.dataset.i),t.value);else if(c=='ap')S.assets.find(a=>a.id==t.dataset.i).price=+t.value||0;else if(c=='ac')S.assets.find(a=>a.id==t.dataset.i).cost=+t.value||0;else if(c=='csv'){const f=t.files[0];if(f){const r=new FileReader();r.onload=()=>{const n=csvImp(r.result);MSG=n?n+' işlem eklendi.':'Dosyadan harcama okunamadı. Başlıkta tarih, açıklama ve tutar sütunları olmalı.';save();render()};r.readAsText(f)}return}else if(c=='imp'){const f=t.files[0];if(f){const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)}return}save();render()});
render();
if(!window.claude)document.body.classList.add('nc');
fetch('market.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.rows){MK=j;render()}}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
